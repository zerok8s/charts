apiVersion: apps/v1
kind: Deployment
metadata:
  name: alb-controller
  namespace: {{ include "albController.namespace" . }}
  labels:
    app: alb-controller
spec:
  replicas: {{ .Values.albController.controller.replicaCount }}
  selector:
    matchLabels:
      app: alb-controller
  template:
    metadata:
      labels:
        app: alb-controller
        azure.workload.identity/use: "true"
        sidecar.istio.io/inject: 'false'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8001'
        kubernetes.azure.com/set-kube-service-host-fqdn: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/cluster
                operator: Exists
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - alb-controller
              topologyKey: kubernetes.io/hostname
            weight: 100
      priorityClassName: system-node-critical
      serviceAccountName: alb-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      {{- with .Values.albController.controller.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end}}
      tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 6000
      {{- range .Values.albController.controller.tolerations }}
      - key: {{ .key }}
        operator: {{ .operator }}
        {{- if .effect }}
        effect: {{ .effect }}
        {{- end }}
        {{- if .value }}
        value: {{ .value | quote }}
        {{- end }}
        {{- if .tolerationSeconds }}
        tolerationSeconds: {{ .tolerationSeconds }}
        {{- end }}
      {{- end }}
      initContainers:
      # This container installs the CRDs required by alb controller on the cluster
        - name: init-alb-controller-crds
          image: "{{ include "albControllerCRDs.image" . }}"
          imagePullPolicy: {{ .Values.albController.image.pullPolicy }}
          command:
          - kubectl
          - apply
          - -f
          - /alb-controller-crds/agc-crds
          {{- if .Values.albController.installGatewayApiCRDs }}
          - -f
          - /alb-controller-crds/gateway-api-crds
          {{- end }}
          {{- if .Values.albController.securityPolicyFeatureFlag }}
          - -f
          - /alb-controller-crds/extra-crds/alb.networking.azure.io_webapplicationfirewallpolicy.yaml
          {{- end }}
          {{- if .Values.albController.ipAccessRulesFeatureFlag }}
          - -f
          - /alb-controller-crds/extra-crds/alb.networking.azure.io_ipaccessrulespolicy.yaml
          {{- end }}
          resources:
            limits:
              cpu: "{{.Values.albController.init.resource.limits.cpu}}"
              memory: "{{.Values.albController.init.resource.limits.memory}}"
            requests:
              cpu: "{{.Values.albController.init.resource.requests.cpu}}"
              memory: "{{.Values.albController.init.resource.requests.memory}}"
      # This container installs the default CR's required by alb controller on the cluster
        - name: init-alb-controller-bootstrap
          image:  "{{ include "albControllerBootstrap.image" .}}"
          imagePullPolicy:  {{ .Values.albController.image.pullPolicy }}
          command: ['/alb-controller-bootstrap']
          resources:
            limits:
              cpu: "{{.Values.albController.init.resource.limits.cpu}}"
              memory: "{{.Values.albController.init.resource.limits.memory}}"
            requests:
              cpu: "{{.Values.albController.init.resource.requests.cpu}}"
              memory: "{{.Values.albController.init.resource.requests.memory}}"
      containers:
        - name: alb-controller
          image: "{{ include "albController.image" . }}"
          imagePullPolicy: {{ .Values.albController.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: "http"
              containerPort: 8000
              protocol: TCP
            - name: "metrics"
              containerPort: 8001
              protocol: TCP
          command: ['/alb-controller']
          env:
          {{- if .Values.albController.podIdentity }}
          - name: AZURE_CLIENT_ID
            value: {{ .Values.albController.podIdentity.clientID }}
          {{- end }}
          {{- range .Values.albController.env }}
          {{- if .name }}
          - name: {{ quote .name }}
            value: {{ quote .value }}
          {{- end }}
          {{- end }}
          args: [
            "--log-level", "{{ .Values.albController.logLevel }}",
            "--namespace", "{{ include "albController.namespace" . }}",
            {{- if .Values.albController.securityPolicyFeatureFlag }}
            "--alb-security-policy-feature-flag=true",
            {{- end }}
             {{- if .Values.albController.ipAccessRulesFeatureFlag }}
            "--alb-ip-access-rules-policy-feature-flag=true",
            {{- end }}
          ]
          resources:
            limits:
              cpu: "{{.Values.albController.controller.resource.limits.cpu}}"
              memory: "{{.Values.albController.controller.resource.limits.memory}}"
            requests:
              cpu: "{{.Values.albController.controller.resource.requests.cpu}}"
              memory: "{{.Values.albController.controller.resource.requests.memory}}"
    {{- if .Values.albController.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.albController.imagePullSecrets | indent 8 }}
    {{- end }}
