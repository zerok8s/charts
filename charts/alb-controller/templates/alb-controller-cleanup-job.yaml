apiVersion: v1
kind: ServiceAccount
metadata:
  name: alb-predelete-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alb-predelete-role
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: ["alb.networking.azure.io"]
    resources: ["*"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["acn.azure.com"]
    resources: ["overlayextensionconfigs"]
    verbs: ["list", "get", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alb-predelete-binding
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alb-predelete-role
subjects:
  - kind: ServiceAccount
    name: alb-predelete-sa
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: alb-controller-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app: alb-controller
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  template:
    metadata:
      labels:
        app: alb-controller-cleanup
      annotations:
        kubernetes.azure.com/set-kube-service-host-fqdn: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                  - key: type
                    operator: NotIn
                    values:
                      - virtual-kubelet
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - alb-controller
                topologyKey: kubernetes.io/hostname
              weight: 100
      priorityClassName: system-node-critical
      serviceAccountName: alb-predelete-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      {{- with .Values.albController.controller.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 6000
      {{- range .Values.albController.controller.tolerations }}
        - key: {{ .key }}
          operator: {{ .operator }}
          {{- if .effect }}
          effect: {{ .effect }}
          {{- end }}
          {{- if .value }}
          value: {{ .value | quote }}
          {{- end }}
          {{- if .tolerationSeconds }}
          tolerationSeconds: {{ .tolerationSeconds }}
          {{- end }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: cleanup
          image: "{{ include "albControllerCRDs.image" . }}"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if kubectl get crd overlayextensionconfigs.acn.azure.com > /dev/null 2>&1; then
                kubectl delete --ignore-not-found --wait -n {{ include "albController.namespace" . }} overlayextensionconfigs.acn.azure.com -l \
                  "app.kubernetes.io/managed-by=alb-controller"
              else
                echo "CRD OverlayExtensionConfig not found in the cluster. Skipping cleanup."
              fi
    {{- if .Values.albController.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.albController.imagePullSecrets | indent 8 }}
    {{- end }}
